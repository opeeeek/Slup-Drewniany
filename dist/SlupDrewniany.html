<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SłupDrewniany – słupy drewniane wg Eurokodu 5</title>
<style id="appcss">
/* SłupDrewniany – układ aplikacji: dane po lewej, schemat po prawej; wyniki w zakładkach. Oprawa zgodna z BelkaŻB. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --panel2: #f7f8fa; --line: #d9dde3; --line2: #e8ebef;
  --ink: #1b2230; --ink2: #4a5466; --ink3: #7a8494;
  --acc: #1d5bb8; --acc2: #e8f0fc; --acc3: #0f3f86; --onacc: #ffffff; --focus: #8fb2ea;
  --ok: #1d7f3c; --okbg: #e6f4ea; --warn: #a35d00; --warnbg: #fdf1dc; --fail: #c0262d; --failbg: #fde8e8; --info: #5b6576; --infobg: #eef0f3;
  --errln: #f3c2c4; --wrnln: #f0d6a8; --ubbg: #edf0f3; --ubwarn: #d89a2b;
  --field: #ffffff; --hover: #e3e7ed; --grp: #f2f5f9; --itembg: #fbfcfe; --addln: #a9c3ec; --addhov: #d6e5fb; --dashln: #b9c6da;
  --shadow: rgba(20, 30, 50, .18); --scrim: rgba(15, 22, 35, .45); --toastbg: #1d2636; --toastink: #ffffff;
  --hdr: #172235; --hdr2: #22314b; --hdrln: #34486b; --hdrhov: #24344f; --hdrbot: #0b1220;
  --hdrink: #e9eef6; --hdrink2: #dbe4f2; --hdrmut: #8ea2c2; --hdrtag: #b8c7de; --hdrtagln: #4e6386; --hdrfocus: #5d8fe0;
  --stok: #1f6b3a; --stfail: #a8232a; --stwarn: #8a5300; --onst: #ffffff;
  --brand1: #e9d3b0; --brand2: #9c6b35; --brand3: #b5413f; --brand4: #172235; --brand5: #6f4a22;
  /* rysunki */
  --wood: #ecd3a9; --wood2: #d7b27c; --woodln: #8a5a22; --char: #3a3a3a; --steel: #8a96a8; --conc: #c9ced6;
  --dg1: #c0262d; --dg2: #1d5bb8; --dg3: #1d7f3c; --dgfill1: rgba(192,38,45,.10); --dgfill2: rgba(29,91,184,.10); --dgfill3: rgba(29,127,60,.10);
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --ui: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Liberation Sans", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
    --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
    --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
    --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
    --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
    --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
    --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
    --wood: #5b4630; --wood2: #7a5d3c; --woodln: #d9b27a; --char: #bdbdbd; --steel: #7d8899; --conc: #3b4250;
    --dg1: #ef6b6f; --dg2: #6fa2ec; --dg3: #4cbf75; --dgfill1: rgba(239,107,111,.14); --dgfill2: rgba(111,162,236,.14); --dgfill3: rgba(76,191,117,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
  --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
  --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
  --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
  --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
  --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
  --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
  --wood: #5b4630; --wood2: #7a5d3c; --woodln: #d9b27a; --char: #bdbdbd; --steel: #7d8899; --conc: #3b4250;
  --dg1: #ef6b6f; --dg2: #6fa2ec; --dg3: #4cbf75; --dgfill1: rgba(239,107,111,.14); --dgfill2: rgba(111,162,236,.14); --dgfill3: rgba(76,191,117,.14);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--ui); color: var(--ink); background: var(--bg); overflow: hidden; font-variant-numeric: tabular-nums; }
button { font: inherit; }
sub, sup { font-size: 72%; line-height: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- pasek górny */
#top { min-height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--hdr); color: var(--hdrink); border-bottom: 1px solid var(--hdrbot); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; white-space: nowrap; }
.brand b { font-weight: 650; letter-spacing: .2px; }
.brand .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--hdrtagln); border-radius: 3px; color: var(--hdrtag); }
#projName { width: 190px; background: var(--hdr2); border: 1px solid var(--hdrln); color: var(--hdrink); padding: 5px 8px; border-radius: 4px; font: inherit; }
#projName:focus { outline: 2px solid var(--hdrfocus); outline-offset: -1px; }
.tb { display: flex; gap: 4px; align-items: center; }
.tb button { background: transparent; color: var(--hdrink2); border: 1px solid transparent; padding: 6px 9px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tb button:hover { background: var(--hdrhov); border-color: var(--hdrln); }
.tb button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.tb .sep { width: 1px; height: 22px; background: var(--hdrln); margin: 0 4px; }
#status { margin-left: auto; padding: 6px 12px; border-radius: 4px; font-weight: 600; white-space: nowrap; font-size: 13px; color: var(--onst); background: var(--hdr2); }
#status.ok { background: var(--stok); } #status.fail { background: var(--stfail); } #status.warn { background: var(--stwarn); }
#fileName { color: var(--hdrmut); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- układ */
main { display: flex; height: calc(100% - 50px); }
#out { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 16px 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--ink2); border-radius: 5px 5px 0 0; font-weight: 550; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--panel); border-color: var(--line); color: var(--acc3); margin-bottom: -1px; }
.pane { display: none; flex: 1; overflow: auto; background: var(--panel); padding: 16px 16px 30px 18px; }
.pane.on { display: block; }
.tscroll { max-width: 100%; overflow-x: auto; }
.datawrap { display: grid; grid-template-columns: minmax(0, var(--dl, 1.25fr)) 8px minmax(0, var(--dr, 1fr)); gap: 10px; align-items: start; }
.dsplit { align-self: stretch; cursor: col-resize; border-radius: 4px; position: relative; }
.dsplit::after { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px; background: var(--line2); border-radius: 2px; }
.dsplit:hover::after { background: var(--acc); }
#inputs { min-width: 0; columns: 2 330px; column-gap: 14px; }
#inputs details.grp { break-inside: avoid; display: block; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
#dataside { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* ---------- formularz */
details.grp > summary { list-style: none; cursor: pointer; padding: 9px 16px; font-weight: 650; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--acc3); background: var(--panel2); display: flex; align-items: center; gap: 8px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(-45deg); transition: transform .12s; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
.fields { padding: 6px 16px 10px; }
.row { display: grid; grid-template-columns: 1fr 156px 42px; align-items: center; gap: 6px; min-height: 30px; }
.row label { color: var(--ink2); font-size: 12.5px; }
.row .unit { color: var(--ink3); font-size: 11.5px; }
.row.wide { grid-template-columns: 1fr 230px; }
.row.full { grid-template-columns: 1fr; }
.sub { font-weight: 650; color: var(--acc3); font-size: 12px; margin: 10px 0 4px; padding-top: 6px; border-top: 1px dashed var(--line); }
.hint { font-size: 11.5px; color: var(--ink3); margin: 0 0 6px; padding-left: 2px; }
.hint b { color: var(--ink2); font-weight: 600; }
.hint.keep { color: var(--ink2); }
details.ex > summary { cursor: pointer; color: var(--acc); font-size: 11.5px; list-style: none; }
details.ex > summary::before { content: "▸ "; }
details.ex[open] > summary::before { content: "▾ "; }
details.ex > summary::-webkit-details-marker { display: none; }
select, .combo input, .txt { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font: inherit; color: var(--ink); padding: 0 6px; width: 100%; }
select:focus, .combo input:focus, .txt:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--acc); }
select { padding-right: 2px; }
.combo { display: flex; position: relative; }
.combo input { border-radius: 4px 0 0 4px; text-align: right; padding-right: 6px; }
.combo input::placeholder { color: var(--ink3); font-style: italic; }
.combo button { width: 24px; border: 1px solid var(--line); border-left: 0; background: var(--panel2); border-radius: 0 4px 4px 0; cursor: pointer; color: var(--ink2); padding: 0; }
.combo button:hover { background: var(--acc2); }
.combo input.bad, .txt.bad { border-color: var(--fail); background: var(--failbg); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--ink2); font-size: 12.5px; cursor: pointer; }
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--acc); flex: none; }
.chkrow { display: flex; flex-wrap: wrap; gap: 4px 14px; }
#pop { position: fixed; z-index: 130; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px var(--shadow); border-radius: 4px; max-height: 260px; overflow-y: auto; display: none; min-width: 120px; }
#pop div { padding: 4px 10px; cursor: pointer; text-align: right; }
#pop div:hover, #pop div.cur { background: var(--acc2); color: var(--acc3); }
.lnk { background: none; border: 0; color: var(--acc); cursor: pointer; padding: 0; font-size: inherit; text-decoration: underline dotted; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--warnbg); box-shadow: 0 0 0 2px var(--ubwarn); } 100% { background: transparent; box-shadow: none; } }

/* ---------- listy obciążeń */
.ldl { margin: 4px 0 8px; }
.ldl h5 { margin: 8px 0 4px; font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 8px; }
.ldl h5 .sp { flex: 1; }
.ldi { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 5px; background: var(--itembg); padding: 5px 8px; margin-bottom: 4px; cursor: pointer; font-size: 12px; }
.ldi:hover { border-color: var(--addln); background: var(--acc2); }
.ldi .id { font-weight: 700; color: var(--acc3); }
.ldi .nm { color: var(--ink); font-weight: 600; }
.ldi .ds { color: var(--ink3); font-size: 11.5px; }
.ldi .du { font-size: 11px; color: var(--ink3); }
.addb { border: 1px dashed var(--addln); background: transparent; color: var(--acc); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 11.5px; }
.addb:hover { background: var(--addhov); }
.ptab { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0; }
.ptab th { font-weight: 500; color: var(--ink3); font-size: 11px; padding: 2px; text-align: center; }
.ptab td { padding: 2px; }
.ptab input { height: 25px; width: 100%; text-align: right; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--ink); padding: 0 5px; font: inherit; }
.ptab .x { border: 0; background: none; color: var(--fail); cursor: pointer; font-size: 15px; }
.gen { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel2); margin: 8px 0; }
.gen h5 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); }
.gen .res { font-size: 12px; color: var(--ink2); margin: 6px 0; }

/* ---------- pasek szybkich wyników i doboru */
#dsum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; font-size: 12px; background: var(--panel); cursor: pointer; color: var(--ink2); }
.chip b { color: var(--ink); }
.chip.ok { border-color: var(--ok); background: var(--okbg); } .chip.ok b { color: var(--ok); }
.chip.fail { border-color: var(--fail); background: var(--failbg); } .chip.fail b { color: var(--fail); }
.chip.warn { border-color: var(--warn); background: var(--warnbg); } .chip.warn b { color: var(--warn); }
#autobar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
#autobar .lim { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
#autobar .lim input { width: 60px; height: 26px; text-align: right; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--ink); padding: 0 6px; font: inherit; }
#autobar .sp { flex: 1; }

/* ---------- zakładki elementów (słupy w projekcie) */
.beamtabs { display: flex; flex-wrap: wrap; gap: 4px; }
.btab { border: 1px solid var(--line); background: var(--panel2); color: var(--ink2); border-radius: 4px; padding: 3px 9px; cursor: pointer; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.btab span { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btab.on { background: var(--acc); color: var(--onacc); border-color: var(--acc); }
.btab i { font-style: normal; font-weight: 700; padding: 0 2px; }
.btab.add { font-weight: 700; }

/* ---------- podsumowanie */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); position: relative; overflow: hidden; min-width: 0; }
.card .t { font-size: 11.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
.card .v { font-size: 20px; font-weight: 650; margin-top: 3px; }
.card .s { font-size: 12px; color: var(--ink2); margin-top: 1px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.card.ok::before { background: var(--ok); } .card.fail::before { background: var(--fail); } .card.warn::before { background: var(--warn); }
.msgs { margin: 0 0 14px; }
.msg { padding: 7px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 12.5px; }
.msg.err { background: var(--failbg); color: var(--fail); border: 1px solid var(--errln); }
.msg.wrn { background: var(--warnbg); color: var(--warn); border: 1px solid var(--wrnln); }
.msg.inf { background: var(--infobg); color: var(--info); border: 1px solid var(--line); }
table.ctab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.ctab th { text-align: left; font-weight: 600; color: var(--ink3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel2); position: sticky; top: -16px; z-index: 1; }
table.ctab td { padding: 5px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.ctab tr.g td { background: var(--grp); font-weight: 650; color: var(--acc3); padding-top: 9px; font-size: 12px; letter-spacing: .2px; }
table.ctab td.ref { color: var(--ink3); white-space: nowrap; font-size: 11.5px; }
table.ctab td.val { white-space: nowrap; text-align: right; }
table.ctab td.nt { color: var(--ink3); font-size: 11.5px; max-width: 360px; }
table.ctab td.cb { color: var(--ink3); font-size: 11px; max-width: 220px; }
table.ctab tr.done td { background: color-mix(in srgb, var(--okbg) 55%, transparent); }
table.ctab .tk { width: 26px; text-align: center; }
.xclick { cursor: pointer; }
.xclick:hover { background: var(--acc2) !important; }
.ub { width: 120px; height: 8px; background: var(--ubbg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ub i { display: block; height: 100%; background: var(--ok); }
.ub.warn i { background: var(--ubwarn); } .ub.fail i { background: var(--fail); }
.pct { display: inline-block; width: 48px; text-align: right; margin-left: 6px; font-weight: 600; font-size: 12px; }
.st { display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; }
.st.ok { background: var(--okbg); color: var(--ok); } .st.fail { background: var(--failbg); color: var(--fail); } .st.warn { background: var(--warnbg); color: var(--warn); } .st.info { background: var(--infobg); color: var(--info); }
.nref { background: none; border: 0; color: var(--acc); cursor: pointer; padding: 0; font: inherit; font-size: 11.5px; text-decoration: underline dotted; }
.goto { border: 1px solid var(--addln); background: var(--panel); color: var(--acc); border-radius: 4px; font-size: 11px; padding: 1px 6px; cursor: pointer; margin-left: 6px; }
.goto:hover { background: var(--addhov); }
.tickbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; font-size: 12.5px; }
.tickbar .hint { margin: 0 0 0 auto; }
.failnav { margin: 0 0 10px; font-size: 12.5px; color: var(--fail); font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.failnav .goto { color: var(--fail); border-color: var(--errln); margin: 0; }

/* ---------- wyniki: przekroje, wykresy, rysunki */
.h2 { font-size: 14px; font-weight: 650; margin: 4px 0 10px; color: var(--ink); text-wrap: balance; }
.h2 small { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.flex { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.flex > * { min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); max-width: 100%; overflow-x: auto; }
.box h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); display: flex; gap: 8px; align-items: center; }
.box h4 small { font-weight: 400; color: var(--ink3); }
svg text { font-family: var(--ui); }
.kv { border-collapse: collapse; font-size: 12.5px; }
.kv td { padding: 2px 10px 2px 0; vertical-align: top; }
.kv td:first-child { color: var(--ink2); }
.kv td:nth-child(2) { text-align: right; font-weight: 600; white-space: nowrap; }
.kv td:nth-child(3) { color: var(--ink3); }
.kv tr.hl td { background: var(--acc2); }
table.sched { border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
table.sched th, table.sched td { border: 1px solid var(--line); padding: 4px 8px; }
table.sched th { background: var(--panel2); font-weight: 600; color: var(--ink2); font-size: 12px; }
table.sched td.n { text-align: right; white-space: nowrap; }
table.sched tr.tot td { font-weight: 700; background: var(--panel2); }
table.sched tr.cur td { background: var(--acc2); }
table.sched.click tbody tr { cursor: pointer; }
table.sched.click tbody tr:hover td { background: var(--acc2); }
.svgclick { cursor: pointer; }
.svgclick:hover { opacity: .8; }
.hot { cursor: pointer; }
.hot:hover rect, .hot:hover path, .hot:hover circle { stroke: var(--acc) !important; }

/* ---------- wydruk: bez nagłówka i stopki przeglądarki; marginesy z tabeli-ramki powtarzanej na każdej stronie */
@page { margin: 0; size: A4; }
@media print {

/* ---------------------------------------- oparcie, docisk, stężenia */

    const across = cfg.dir === 'y' ? (g.type === 'round' ? g.d : g.h) : (g.type === 'round' ? g.d : g.b);

    const lef = l + ext(Infinity) + ext(endA);

/* ---------------------------------------- pożar (PN-EN 1995-1-2, 4.2.2) */

// sztywność E_d = E_0,mean/γ_M (2.4.1(2)P) albo E_0,05/γ_M; imperfekcja łukowa e = l_ef/x (5.4.4: 0,0025·l) w kształcie postaci wyboczenia,

function autoDesign(S0, opt) {

  else if (S.geom.type === 'spaced') { [32, 38, 45, 50, 63, 75, 80, 100].forEach(t => [100, 120, 140, 160, 180, 200, 220, 240].forEach(w => { if (w >= t) cands.push({ t, w, A: t * w }); })); }
  else {
    const B = glu ? DIMS_GL_B : DIMS_SOLID, H = glu ? DIMS_GL_H : DIMS_SOLID;
    B.forEach(b => H.forEach(h => { if (h < b) return; if (opt.square && h !== b) return; if (h > 4 * b) return; cands.push({ b, h, A: b * h }); }));
  }
  cands.sort((a, b) => a.A - b.A || (a.h || 0) - (b.h || 0));
  for (const c of cands) {
    const T = deep(S);
    if (T.geom.type === 'round') T.geom.d = c.d;
    else if (T.geom.type === 'spaced') { T.geom.sp.t = c.t; T.geom.sp.w = c.w; }
    else {
      // orientacja: większy wymiar w płaszczyźnie większego wytężenia (domyślnie h – oś y)
      T.geom.b = c.b; T.geom.h = c.h;
    }
    if (T.buck.method === 'kc') T.buck.both = false;
    const R = calc(T);
    if (R.errors.length) continue;
    const u = R.checks.filter(k => k.status !== 'info' && !k.warnOnly && k.fmt !== 'text').reduce((a, k) => Math.max(a, isFinite(k.ratio) ? k.ratio : 99), 0);
    if (u <= lim + 1e-9) {
      // dla prostokąta sprawdź też orientację odwrotną, gdy daje mniejsze wytężenie
      if (T.geom.type === 'rect' && c.b !== c.h) {

        const u2 = R2.checks.filter(k => k.status !== 'info' && !k.warnOnly && k.fmt !== 'text').reduce((a, k) => Math.max(a, isFinite(k.ratio) ? k.ratio : 99), 0);
        if (!R2.errors.length && u2 < u) return { ok: true, geom: T2.geom, util: u2 };

<script>
/* SłupDrewniany – podręczne objaśnienia punktów norm (streszczenia własne, nie cytaty) */
(function () {
'use strict';
const N = {
  '2.2.2': { t: 'Analiza konstrukcji – efekty II rzędu', s: 'Rozkład sił wewnętrznych wyznacza się analizą liniowo-sprężystą. Gdy przemieszczenia istotnie zmieniają siły wewnętrzne (elementy ściskane smukłe, układy przesuwne), należy uwzględnić efekty II rzędu – bezpośrednio (analiza II rzędu z imperfekcjami) albo pośrednio, przez metodę współczynnika wyboczeniowego k<sub>c</sub> (6.3.2).', h: 'Program domyślnie stosuje metodę k<sub>c</sub>; analizę II rzędu można wybrać jako metodę decydującą lub obliczyć kontrolnie.' },
  '2.3.1.2': { t: 'Klasy trwania obciążenia', s: 'Oddziaływania przypisuje się do klas: stałe (> 10 lat), długotrwałe (6 mies.–10 lat), średniotrwałe (1 tydz.–6 mies.), krótkotrwałe (< 1 tydz.) i chwilowe. Klasa decyduje o współczynniku k<sub>mod</sub>. Wg ZK PL śnieg traktuje się jako krótkotrwały, wiatr – jako chwilowy.', h: 'Dla kombinacji obciążeń o różnej klasie trwania przyjmuje się k<sub>mod</sub> odpowiadające obciążeniu o najkrótszym czasie trwania (3.1.3(2)) – dlatego kombinacja samych obciążeń stałych (k<sub>mod</sub> = 0,6) często decyduje.' },
  '2.3.1.3': { t: 'Klasy użytkowania', s: 'Klasa 1 – wilgotność drewna odpowiadająca 20 °C i RH ≤ 65% (wnętrza ogrzewane, w ≤ 12%); klasa 2 – RH ≤ 85% (pomieszczenia nieogrzewane, zadaszenia, w ≤ 20%); klasa 3 – warunki prowadzące do większej wilgotności (konstrukcje na zewnątrz bez osłony).', h: 'Klasa użytkowania wpływa na k<sub>mod</sub> (tab. 3.1) i k<sub>def</sub> (tab. 3.2).' },
  '2.3.2.2': { t: 'Odkształcenia z uwzględnieniem pełzania', s: 'Przemieszczenie końcowe: u<sub>fin</sub> = u<sub>fin,G</sub> + u<sub>fin,Q1</sub> + Σu<sub>fin,Qi</sub>, gdzie u<sub>fin,G</sub> = u<sub>inst,G</sub>(1 + k<sub>def</sub>), u<sub>fin,Q1</sub> = u<sub>inst,Q1</sub>(1 + ψ<sub>2,1</sub>k<sub>def</sub>), u<sub>fin,Qi</sub> = u<sub>inst,Qi</sub>(ψ<sub>0,i</sub> + ψ<sub>2,i</sub>k<sub>def</sub>).', f: 'u<sub>fin</sub> = u<sub>inst,G</sub>(1+k<sub>def</sub>) + u<sub>inst,Q1</sub>(1+ψ<sub>2,1</sub>k<sub>def</sub>) + Σu<sub>inst,Qi</sub>(ψ<sub>0,i</sub>+ψ<sub>2,i</sub>k<sub>def</sub>)', h: 'Sztywność natychmiastowa – wartości średnie E<sub>0,mean</sub>, G<sub>mean</sub>.' },
  '2.4.1': { t: 'Wartości obliczeniowe właściwości materiału', s: 'Wytrzymałość obliczeniowa: X<sub>d</sub> = k<sub>mod</sub>·X<sub>k</sub>/γ<sub>M</sub>. Do analizy II rzędu sztywność obliczeniowa E<sub>d</sub> = E<sub>mean</sub>/γ<sub>M</sub> (2.4.1(2)P).', f: 'X<sub>d</sub> = k<sub>mod</sub>·X<sub>k</sub>/γ<sub>M</sub>; E<sub>d</sub> = E<sub>mean</sub>/γ<sub>M</sub>', h: 'γ<sub>M</sub> (tab. 2.3): drewno lite 1,3; klejone 1,25; LVL 1,2; sytuacja wyjątkowa 1,0.' },
  '3.1.3': { t: 'Wpływ trwania obciążenia i wilgotności – k<sub>mod</sub>', s: 'Współczynnik k<sub>mod</sub> (tab. 3.1) zależy od materiału, klasy użytkowania i klasy trwania obciążenia. Dla kombinacji przyjmuje się wartość odpowiadającą najkrótszemu obciążeniu w kombinacji.', f: 'SC1/SC2: 0,60 / 0,70 / 0,80 / 0,90 / 1,10; SC3: 0,50 / 0,55 / 0,65 / 0,70 / 0,90 (stałe … chwilowe)', h: 'Program generuje kombinacje ze wszystkimi podzbiorami obciążeń zmiennych, aby wykryć kombinacje o niższym k<sub>mod</sub>.' },
  '3.1.4': { t: 'Pełzanie – k<sub>def</sub>', s: 'Współczynnik k<sub>def</sub> (tab. 3.2) opisuje przyrost odkształceń w czasie: drewno lite, klejone, LVL – SC1: 0,6; SC2: 0,8; SC3: 2,0.', h: 'Dla drewna litego wbudowanego przy wilgotności bliskiej punktu nasycenia włókien k<sub>def</sub> zwiększa się o 1,0 (3.2(4)).' },
  '3.2': { t: 'Drewno lite – współczynnik wysokości k<sub>h</sub>', s: 'Dla przekrojów o wysokości (przy zginaniu) lub największym wymiarze (przy rozciąganiu) mniejszym niż 150 mm i ρ<sub>k</sub> ≤ 700 kg/m³ wartości f<sub>m,k</sub> i f<sub>t,0,k</sub> można zwiększyć współczynnikiem k<sub>h</sub>.', f: 'k<sub>h</sub> = min{(150/h)<sup>0,2</sup>; 1,3}' },
  '3.3': { t: 'Drewno klejone warstwowo – k<sub>h</sub>', s: 'Dla wysokości przekroju mniejszej niż 600 mm wytrzymałości na zginanie i rozciąganie można zwiększyć współczynnikiem k<sub>h</sub>.', f: 'k<sub>h</sub> = min{(600/h)<sup>0,1</sup>; 1,1}' },
  '3.4': { t: 'LVL – efekt skali', s: 'Dla wysokości mniejszej niż 300 mm wytrzymałość na zginanie można zwiększyć współczynnikiem k<sub>h</sub> z wykładnikiem efektu skali s podanym przez producenta.', f: 'k<sub>h</sub> = min{(300/h)<sup>s</sup>; 1,2}' },
  '5.4.4': { t: 'Ramy i łuki – imperfekcje do analizy II rzędu', s: 'W analizie II rzędu uwzględnia się imperfekcje geometryczne: przechyłkę φ = 0,005 dla h ≤ 5 m (φ = 0,005·√(5/h) dla h > 5 m) i wygięcie wstępne e = 0,0025·l w kształcie odpowiadającym postaci wyboczenia.', f: 'φ = 0,005·√(5/h) ≤ 0,005; e = 0,0025·l', h: 'Imperfekcje przyjmuje się w jednej płaszczyźnie naraz; sztywność E<sub>mean</sub>/γ<sub>M</sub>.' },
  '6.1.2': { t: 'Rozciąganie wzdłuż włókien', s: 'Naprężenie obliczeniowe od rozciągania osiowego nie może przekraczać wytrzymałości obliczeniowej na rozciąganie wzdłuż włókien (z ewentualnym k<sub>h</sub>). Pole przekroju netto – z uwzględnieniem osłabień.', f: 'σ<sub>t,0,d</sub> ≤ f<sub>t,0,d</sub>', h: 'W słupach rozciąganie występuje przy ssaniu wiatru na dach – wymaga też zakotwienia podstawy.' },
  '6.1.4': { t: 'Ściskanie wzdłuż włókien', s: 'Naprężenie ściskające wzdłuż włókien nie może przekraczać wytrzymałości obliczeniowej. Warunek nośności przekroju; stateczność sprawdza się osobno (6.3.2).', f: 'σ<sub>c,0,d</sub> ≤ f<sub>c,0,d</sub>', h: 'Ten sam warunek obejmuje docisk czoła słupa do stalowej blachy podstawy.' },
  '6.1.5': { t: 'Ściskanie prostopadłe do włókien (docisk)', s: 'Naprężenie od siły prostopadłej do włókien na efektywnej powierzchni styku nie może przekraczać k<sub>c,90</sub>·f<sub>c,90,d</sub>. Efektywna długość styku: rzeczywista długość powiększona o 30 mm z każdej strony (nie więcej niż a, l, l<sub>1</sub>/2).', f: 'σ<sub>c,90,d</sub> = F<sub>c,90,d</sub>/A<sub>ef</sub> ≤ k<sub>c,90</sub>·f<sub>c,90,d</sub>', h: 'k<sub>c,90</sub>: podparcie ciągłe – 1,25 (lite iglaste), 1,5 (klejone); podpory dyskretne, l ≤ 400 mm – 1,5 / 1,75; pozostałe 1,0. Dotyczy podwaliny pod słupem i belki (oczepu) opartej na głowicy.' },
  '6.1.6': { t: 'Zginanie', s: 'Przy zginaniu dwukierunkowym spełnione muszą być dwa warunki – z pełnym udziałem momentu wokół jednej osi i zredukowanym (k<sub>m</sub>) wokół drugiej.', f: 'σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + k<sub>m</sub>·σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1; k<sub>m</sub>·σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1', h: 'k<sub>m</sub> = 0,7 dla przekrojów prostokątnych z drewna litego, klejonego i LVL; 1,0 dla innych przekrojów (okrągłe – moment wypadkowy).' },
  '6.1.7': { t: 'Ścinanie', s: 'Naprężenie styczne nie może przekraczać f<sub>v,d</sub>. Wpływ pęknięć uwzględnia się efektywną szerokością b<sub>ef</sub> = k<sub>cr</sub>·b.', f: 'τ<sub>d</sub> = 1,5·V<sub>d</sub>/(k<sub>cr</sub>·b·h) ≤ f<sub>v,d</sub>', h: 'k<sub>cr</sub> = 0,67 dla drewna litego i klejonego, 1,0 dla LVL. Przy ścinaniu w dwóch kierunkach program sprawdza naprężenie wypadkowe w środku przekroju.' },
  '6.2.3': { t: 'Zginanie z rozciąganiem osiowym', s: 'Udział rozciągania sumuje się liniowo z udziałami zginania w obu kierunkach.', f: 'σ<sub>t,0,d</sub>/f<sub>t,0,d</sub> + σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + k<sub>m</sub>·σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1 (i odwrotnie)' },
  '6.2.4': { t: 'Zginanie ze ściskaniem osiowym – nośność przekroju', s: 'Udział ściskania wchodzi do warunku w kwadracie (uplastycznienie strefy ściskanej drewna). Warunek przekroju – bez wyboczenia.', f: '(σ<sub>c,0,d</sub>/f<sub>c,0,d</sub>)² + σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + k<sub>m</sub>·σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1 (i odwrotnie)', h: 'Gdy λ<sub>rel,y</sub> i λ<sub>rel,z</sub> ≤ 0,3, sprawdzenie przekroju wystarcza (6.3.2(2)).' },
  '6.3.2': { t: 'Słupy ściskane lub ściskane i zginane – metoda k<sub>c</sub>', s: 'Smukłość względna λ<sub>rel</sub> = λ/π·√(f<sub>c,0,k</sub>/E<sub>0,05</sub>). Dla λ<sub>rel</sub> > 0,3 wytrzymałość na ściskanie redukuje się współczynnikiem wyboczeniowym k<sub>c</sub>, zależnym od współczynnika imperfekcji β<sub>c</sub> (0,2 – drewno lite, 0,1 – klejone i LVL).', f: 'k = 0,5·[1 + β<sub>c</sub>(λ<sub>rel</sub> − 0,3) + λ<sub>rel</sub>²]; k<sub>c</sub> = 1/(k + √(k² − λ<sub>rel</sub>²)); σ<sub>c,0,d</sub>/(k<sub>c,y</sub>f<sub>c,0,d</sub>) + σ<sub>m,y,d</sub>/f<sub>m,y,d</sub> + k<sub>m</sub>σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> ≤ 1 (6.23); analogicznie (6.24)', h: 'Długość wyboczeniową program wyznacza MES (zagadnienie własne) dla rzeczywistych warunków podparcia, stężeń i podatności podstawy; można ją podać ręcznie.' },
  '6.3.3': { t: 'Zwichrzenie', s: 'Elementy zginane wokół osi mocnej sprawdza się na zwichrzenie: naprężenie krytyczne σ<sub>m,crit</sub>, smukłość λ<sub>rel,m</sub> = √(f<sub>m,k</sub>/σ<sub>m,crit</sub>) i współczynnik k<sub>crit</sub>. Przy jednoczesnym ściskaniu – warunek (6.35).', f: 'σ<sub>m,crit</sub> = π·√(E<sub>0,05</sub>I<sub>z</sub>G<sub>0,05</sub>I<sub>tor</sub>)/(l<sub>ef</sub>W<sub>y</sub>); (σ<sub>m,d</sub>/(k<sub>crit</sub>f<sub>m,d</sub>))² + σ<sub>c,d</sub>/(k<sub>c,z</sub>f<sub>c,0,d</sub>) ≤ 1', h: 'k<sub>crit</sub> = 1 dla λ<sub>rel,m</sub> ≤ 0,75; 1,56 − 0,75λ dla 0,75 < λ ≤ 1,4; 1/λ² dla λ > 1,4. l<sub>ef</sub> wg tab. 6.1. Program dodaje składnik σ<sub>m,z,d</sub>/f<sub>m,z,d</sub> przy zginaniu dwukierunkowym (praktyka projektowa).' },
  '6.6': { t: 'Wytrzymałość systemowa k<sub>sys</sub>', s: 'Gdy kilka jednakowych elementów rozmieszczonych w równych odstępach jest połączonych układem rozkładającym obciążenie, wytrzymałości można zwiększyć współczynnikiem k<sub>sys</sub> (zwykle 1,1).', h: 'Dla pojedynczych słupów przyjmuje się k<sub>sys</sub> = 1,0.' },
  '7.2': { t: 'Wartości graniczne przemieszczeń', s: 'Przemieszczenia ogranicza się ze względu na wygląd, użytkowalność i uszkodzenia elementów niekonstrukcyjnych. Norma podaje zalecane zakresy dla belek (l/300–l/500 natychmiastowe, l/150–l/300 końcowe); dla przemieszczeń poziomych słupów wartości uzgadnia się z inwestorem.', h: 'Domyślnie: u<sub>inst</sub> ≤ l/300, u<sub>fin</sub> ≤ l/150 (dla odcinka między podparciami bocznymi, wspornik – od podparcia do głowicy).' },
  '9.2.5.2': { t: 'Stężenia pojedynczych elementów ściskanych', s: 'Podparcia boczne skracające długość wyboczeniową muszą mieć wystarczającą sztywność i nośność: sztywność sprężyny C ≥ k<sub>s</sub>·N<sub>d</sub>/a oraz siła w stężeniu F<sub>d</sub> = N<sub>d</sub>/k<sub>f,1</sub> (drewno lite) lub N<sub>d</sub>/k<sub>f,2</sub> (klejone, LVL).', f: 'C ≥ k<sub>s</sub>·N<sub>d</sub>/a; k<sub>s</sub> = 2·(1 + cos(π/m)); F<sub>d</sub> = N<sub>d</sub>/k<sub>f</sub>', h: 'Wartości zalecane: k<sub>f,1</sub> = 50, k<sub>f,2</sub> = 80. m – liczba przedziałów o długości a.' },
  'C.3': { t: 'Słupy wielogałęziowe z przekładkami lub nakładkami', s: 'Nośność względem osi materiałowej (przechodzącej przez gałęzie) – suma nośności gałęzi. Względem osi niematerialnej stosuje się smukłość zastępczą λ<sub>ef</sub>, uwzględniającą podatność połączeń (współczynnik η, tab. C.1) i smukłość gałęzi λ<sub>1</sub> między przekładkami.', f: 'λ<sub>ef</sub> = √(λ² + η·n/2·λ<sub>1</sub>²); λ = l·√(A<sub>tot</sub>/I<sub>tot</sub>); λ<sub>1</sub> = √12·l<sub>1</sub>/h (λ<sub>1</sub> ≥ 30)', h: 'Warunki: co najmniej 3 przedziały; a ≤ 3h (przekładki) lub 6h (nakładki); l<sub>2</sub> ≥ 1,5a (przekładki) / 2a (nakładki); obciążenie osiowe. η: przekładki klejone 1/1, gwoździowane 4/3, na śruby z wkładkami 3,5/2,5; nakładki klejone 3/2, gwoździowane 6/4,5 (stałe i długotrwałe / średnio- i krótkotrwałe).' },
  'C.3.3': { t: 'Siły w łącznikach przekładek i nakładek', s: 'Siłę poprzeczną zastępczą V<sub>d</sub> wyznacza się w zależności od λ<sub>ef</sub> (C.2.4), a siłę ścinającą w łącznikach jednej przekładki: T<sub>d</sub> = V<sub>d</sub>·l<sub>1</sub>/a<sub>1</sub>.', f: 'V<sub>d</sub> = F<sub>c,d</sub>/(120k<sub>c</sub>) (λ<sub>ef</sub> < 30); F<sub>c,d</sub>λ<sub>ef</sub>/(3600k<sub>c</sub>) (30 ≤ λ<sub>ef</sub> < 60); F<sub>c,d</sub>/(60k<sub>c</sub>) (λ<sub>ef</sub> ≥ 60)' },
  '10.2': { t: 'Tolerancje wykonawcze', s: 'Odchyłka od prostoliniowości elementów ściskanych między podporami nie powinna przekraczać 1/500 długości (drewno klejone, LVL) i 1/300 długości (drewno lite).', h: 'Wartości te są pośrednio zawarte we współczynnikach k<sub>c</sub> (β<sub>c</sub> = 0,1 / 0,2).' },
  'fi2.3': { t: 'Pożar – wartości obliczeniowe', s: 'Wytrzymałość obliczeniowa w pożarze: f<sub>d,fi</sub> = k<sub>mod,fi</sub>·k<sub>fi</sub>·f<sub>k</sub>/γ<sub>M,fi</sub>, gdzie k<sub>fi</sub> przelicza wartości 5% na 20% (1,25 – lite; 1,15 – klejone; 1,1 – LVL), γ<sub>M,fi</sub> = 1,0.', f: 'f<sub>d,fi</sub> = k<sub>mod,fi</sub>·k<sub>fi</sub>·f<sub>k</sub>/γ<sub>M,fi</sub>' },
  'fi2.4.2': { t: 'Pożar – efekty oddziaływań', s: 'Efekty oddziaływań w pożarze wyznacza się z kombinacji wyjątkowej (PN-EN 1990, 6.11b) albo w uproszczeniu: E<sub>d,fi</sub> = η<sub>fi</sub>·E<sub>d</sub> (η<sub>fi</sub> = 0,6; dla obciążeń kat. E – 0,7).' },
  'fi3.4': { t: 'Zwęglanie', s: 'Głębokość zwęglenia: d<sub>char,n</sub> = β<sub>n</sub>·t (zwęglanie umowne, z zaokrągleniem naroży). Prędkości (tab. 3.1): drewno lite iglaste β<sub>n</sub> = 0,8, klejone 0,7, LVL 0,7, liściaste (ρ<sub>k</sub> ≥ 450) 0,55 mm/min. Przy osłonach – opóźnienie początku zwęglania t<sub>ch</sub>, faza przyspieszona po odpadnięciu okładziny t<sub>f</sub>.', f: 'd<sub>char,n</sub> = β<sub>n</sub>·t; t<sub>ch</sub> = 2,8·h<sub>p</sub> − 14 (płyty g-k)', h: 'Osłony: k<sub>2</sub> = 1 − 0,018·h<sub>p</sub> (g-k typu F), k<sub>3</sub> = 2 do głębokości 25 mm.' },
  'fi4.2.2': { t: 'Metoda zredukowanego przekroju', s: 'Przekrój efektywny otrzymuje się, odejmując od przekroju początkowego efektywną głębokość zwęglenia d<sub>ef</sub> = d<sub>char,n</sub> + k<sub>0</sub>·d<sub>0</sub> (d<sub>0</sub> = 7 mm) od każdej ogrzewanej strony. Właściwości przekroju resztkowego jak w temperaturze normalnej (k<sub>mod,fi</sub> = 1,0).', f: 'd<sub>ef</sub> = d<sub>char,n</sub> + k<sub>0</sub>·d<sub>0</sub>; k<sub>0</sub> = t/20 dla t < 20 min, 1,0 dla t ≥ 20 min', h: 'Przy ogrzewaniu niesymetrycznym środek ciężkości przesuwa się – program dodaje moment N·Δe.' },
  '1990-6.10': { t: 'Kombinacje SGN – sytuacja trwała i przejściowa', s: 'Kombinacja podstawowa: 6.10 albo mniej korzystne z 6.10a i 6.10b. Każde obciążenie zmienne kolejno jako wiodące, pozostałe z ψ<sub>0</sub>. Obciążenia stałe niekorzystne γ<sub>G,sup</sub> = 1,35, korzystne γ<sub>G,inf</sub> = 1,0; zmienne γ<sub>Q</sub> = 1,5; ξ = 0,85.', f: '6.10a: Σγ<sub>G</sub>G<sub>k</sub> + γ<sub>Q</sub>ψ<sub>0</sub>Q<sub>k</sub>; 6.10b: Σξγ<sub>G</sub>G<sub>k</sub> + γ<sub>Q,1</sub>Q<sub>k,1</sub> + Σγ<sub>Q,i</sub>ψ<sub>0,i</sub>Q<sub>k,i</sub>' },
  '1990-6.11': { t: 'Kombinacje wyjątkowe i pożarowe', s: 'G<sub>k</sub> + A<sub>d</sub> + (ψ<sub>1,1</sub> lub ψ<sub>2,1</sub>)Q<sub>k,1</sub> + Σψ<sub>2,i</sub>Q<sub>k,i</sub>. Dla pożaru A<sub>d</sub> to oddziaływanie termiczne (zwęglanie).' },
  '1990-6.14': { t: 'Kombinacje SGU', s: 'Charakterystyczna: ΣG<sub>k</sub> + Q<sub>k,1</sub> + Σψ<sub>0,i</sub>Q<sub>k,i</sub> (6.14b); quasi-stała: ΣG<sub>k</sub> + Σψ<sub>2,i</sub>Q<sub>k,i</sub> (6.16b).' },

        const v = it[pl.H], yy = Y(L) + 10 + hOff * 12;
        s += `<g class="hot" data-act="load" data-i="${i}">` + (v > 0 ? arrow(cx - 48, yy, cx - colW / 2 - 2, yy, C.d3, 1.6) : arrow(cx - colW / 2 - 2, yy, cx - 48, yy, C.d3, 1.6)) + T(cx - 52, yy + 4, `${esc(id)}: ${fx(Math.abs(v), 1)} kN${it.rev ? ' ±' : ''}`, { fs: 9.5, a: 'end', c: C.d3 }) + `<title>${esc(it.name)}: H = ${fx(v, 2)} kN</title></g>`;

      }

        if (p.N) s += `<g class="hot" data-act="load" data-i="${i}">` + (p.N > 0 ? arrow(cx + colW / 2 + 6 + clampPx((p[pl.e] || 0) * 0.12), yy - 30, cx + colW / 2 + 6, yy - 2, C.d1, 1.5) : arrow(cx + colW / 2 + 6, yy - 2, cx + colW / 2 + 6, yy - 30, C.d1, 1.5)) + T(cx + colW / 2 + 12, yy - 18, `${esc(id)}: ${fx(Math.abs(p.N), 1)}`, { fs: 9, a: 'start', c: C.d1 }) + '</g>';
        if (p[pl.H]) s += `<g class="hot" data-act="load" data-i="${i}">` + (p[pl.H] > 0 ? arrow(cx - 44, yy, cx - colW / 2 - 2, yy, C.d3, 1.4) : arrow(cx - colW / 2 - 2, yy, cx - 44, yy, C.d3, 1.4)) + T(cx - 48, yy - 3, `${esc(id)}: ${fx(Math.abs(p[pl.H]), 1)}`, { fs: 9, a: 'end', c: C.d3 }) + '</g>';
      });
    });
    // wymiar wysokości
    s += dimV(cx + 62, Y(L), bot, `L = ${fx(S.geom.L, 2)} m`);
    if (R && R.buck && R.buck[pl.p]) s += T(cx, bot + 40, `l_ef = ${fx(R.buck[pl.p].lef / 1000, 3)} m (β = ${fx(R.buck[pl.p].beta, 3)})`, { fs: 10, c: C.acc });
  });
  // podpis sił osiowych
  const nl = items.map((it, i) => it.N ? `${loadId(S, i)} = ${fx(it.N, 1)}` : '').filter(Boolean);
  if (nl.length) s += T(W / 2, 50, `N w głowicy [kN]: ${nl.join(', ')}`, { fs: 10, c: C.d1 });
  if (S.loads.sw && R && R.m) s += T(W / 2, H - 8, `ciężar własny g = ${fx(R.m.gamma * R.g.A * 1e-6, 3)} kN/m (γ = ${fx(R.m.gamma, 2)} kN/m³)`, { fs: 9.5, c: C.ink3 });

const clampPx = v => Math.max(-30, Math.min(30, v));
function loadId(S, i) {

  return id;

/* ------------------------------------------------------------ wykres pionowy (wzdłuż wysokości słupa) */
// o: { W, H, title, unit, xs (stacje [mm]), series: [{ v: [], c, fill, l, dash }], L, dp }
function vChart(o) {
  const W = o.W || 170, H = o.H || 360, top = 30, bot = H - 24, L = o.L;
  const all = o.series.reduce((a, se) => a.concat(se.v.filter(isFinite)), [0]);
  let mn = Math.min(...all), mx = Math.max(...all);
  if (mx - mn < 1e-9) { mx += 1; mn -= 1; }
  const padL = 26, padR = 26, sc = (W - padL - padR) / (mx - mn);
  const X = v => padL + (v - mn) * sc, Y = x => bot - x / L * (bot - top);
  let s = svgOpen(W, H, 'vchart', ` data-chart="${o.key || ''}" data-mn="${mn}" data-mx="${mx}" data-l="${L}" data-top="${top}" data-bot="${bot}"`);
  s += T(W / 2, 13, o.title, { fs: 11, b: true }) + T(W / 2, 25, o.unit || '', { fs: 9.5, c: C.ink3 });
  s += Ln(X(0), top - 2, X(0), bot + 2, C.ink, 1.3);
  [0, 0.25, 0.5, 0.75, 1].forEach(k => { s += Ln(padL - 4, Y(k * L), W - padR + 4, Y(k * L), C.line2, 0.6); });
  o.series.forEach(se => {
    const pts = se.v.map((v, i) => [X(isFinite(v) ? v : 0), Y(o.xs[i])]);
    if (se.fill) s += `<path d="M${X(0)} ${Y(o.xs[0])}${pts.map(p => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('')}L${X(0)} ${Y(o.xs[o.xs.length - 1])}Z" style="fill:${se.fill};stroke:none"/>`;
    s += `<path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('')}" style="fill:none;stroke:${se.c};stroke-width:${se.w || 1.6}${se.dash ? ';stroke-dasharray:' + se.dash : ''}"/>`;
  });
  // wartości ekstremalne
  const lab = (v, i, c) => { if (!isFinite(v) || Math.abs(v) < 1e-9) return ''; const x = X(v), y = Y(o.xs[i]); const right = x > W / 2; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" style="fill:${c}"/>` + T(right ? Math.min(W - 2, x + 2) : Math.max(2, x - 2), Math.max(top + 9, Math.min(bot - 3, y - 5)), fx(v, o.dp === undefined ? 1 : o.dp), { fs: 9.5, a: right ? 'end' : 'start', c, b: true }); };
  o.series.filter(se => !se.nolab).forEach(se => {
    let imx = -1, imn = -1; se.v.forEach((v, i) => { if (imx < 0 || v > se.v[imx]) imx = i; if (imn < 0 || v < se.v[imn]) imn = i; });
    if (imx >= 0 && se.v[imx] > 1e-9) s += lab(se.v[imx], imx, se.c);
    if (imn >= 0 && se.v[imn] < -1e-9) s += lab(se.v[imn], imn, se.c);
  });
  s += T(3, bot + 14, '0', { fs: 9, a: 'start', c: C.ink3 }) + T(3, top - 1, fx(L / 1000, 2), { fs: 9, a: 'start', c: C.ink3 });
  s += `<line class="curline" x1="${padL - 4}" x2="${W - padR + 4}" y1="-10" y2="-10" style="stroke:${C.acc};stroke-dasharray:3 3"/><text class="curtxt" x="${W - 2}" y="-10" font-size="10" text-anchor="end" style="fill:${C.acc}"></text>`;
  return s + '</svg>';
}

/* ------------------------------------------------------------ postacie wyboczenia */
function modeSVG(R, S, o) {
  o = o || {};

  uid++;
  let s = svgOpen(W, H) + `<defs><pattern id="hb${uid}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" style="stroke:${C.ink2};stroke-width:1"/></pattern></defs>`;
  const Y = x => bot - x / L * (bot - top);
  [['z', W * 0.27, 'x–z (wokół osi y)'], ['y', W * 0.73, 'x–y (wokół osi z)']].forEach(([p, cx, t]) => {
    const b = R.buck[p], sp = S.supp[p];
    s += T(cx, 16, `Płaszczyzna ${t}`, { fs: 11.5, b: true });
    s += Ln(cx, Y(0), cx, Y(L), C.line, 3);
    s += supportBase(cx, bot, sp.base, C.ink) + supportTop(cx + 1.5, Y(L), sp.top, C.ink, 1);
    R.braces[p].forEach(xb => { s += Ln(cx, Y(xb), cx + 20, Y(xb), C.acc, 1.3) + Ln(cx + 20, Y(xb) - 7, cx + 20, Y(xb) + 7, C.acc, 1.5); });
    if (b.mode) {
      const amp = 46;
      s += `<path d="${R.xs.map((x, i) => `${i ? 'L' : 'M'}${(cx + b.mode[i] * amp).toFixed(1)} ${Y(x).toFixed(1)}`).join('')}" style="fill:none;stroke:${C.d1};stroke-width:2"/>`;
    }
    s += T(cx, bot + 34, `l_ef = ${fx(b.lef / 1000, 3)} m, β = ${fx(b.beta, 3)}${b.manual ? ' (ręcznie)' : ''}`, { fs: 10.5, c: C.acc });
    s += T(cx, 32, `λ = ${fx(b.lam, 1)}, λ_rel = ${fx(b.lamRel, 3)}, k_c = ${fx(b.kc, 3)}`, { fs: 10, c: C.ink2 });

/* ------------------------------------------------------------ krzywa k_c(λ_rel) */
function kcSVG(R, o) {
  o = o || {};
  const W = o.W || 440, H = o.H || 260, l = 44, r = 14, t = 20, b = 36, xmax = 3;
  const X = v => l + v / xmax * (W - l - r), Y = v => H - b - v * (H - t - b);
  let s = svgOpen(W, H);
  for (let i = 0; i <= 6; i++) { const v = i * 0.5; s += Ln(X(v), Y(0), X(v), Y(1), C.line2, 0.6) + T(X(v), H - b + 14, fx(v, 1), { fs: 9.5, c: C.ink3 }); }
  for (let i = 0; i <= 5; i++) { const v = i * 0.2; s += Ln(X(0), Y(v), X(xmax), Y(v), C.line2, 0.6) + T(l - 5, Y(v) + 3, fx(v, 1), { fs: 9.5, a: 'end', c: C.ink3 }); }
  s += Ln(X(0), Y(0), X(xmax), Y(0), C.ink, 1) + Ln(X(0), Y(0), X(0), Y(1.02), C.ink, 1);
  s += T(W / 2, H - 6, 'λ_rel', { fs: 10.5 }) + T(12, H / 2, 'k_c', { fs: 10.5, rot: -90 });
  const curve = (bc, c, dash) => { let d = ''; for (let i = 0; i <= 120; i++) { const v = i / 120 * xmax; d += `${i ? 'L' : 'M'}${X(v).toFixed(1)} ${Y(E.kcOf(v, bc).kc).toFixed(1)}`; } return `<path d="${d}" style="fill:none;stroke:${c};stroke-width:1.6${dash ? ';stroke-dasharray:' + dash : ''}"/>`; };
  s += curve(0.2, C.d1, R.m.betaC === 0.2 ? '' : '5 3') + curve(0.1, C.d2, R.m.betaC === 0.1 ? '' : '5 3');
  let euler = ''; for (let i = 0; i <= 100; i++) { const v = 0.6 + i / 100 * (xmax - 0.6); euler += `${i ? 'L' : 'M'}${X(v).toFixed(1)} ${Y(Math.min(1, 1 / (v * v))).toFixed(1)}`; }
  s += `<path d="${euler}" style="fill:none;stroke:${C.ink3};stroke-width:1;stroke-dasharray:2 3"/>`;
  s += T(X(2.2), Y(0.36), 'β_c = 0,2 (lite)', { fs: 9.5, c: C.d1, a: 'start' }) + T(X(1.55), Y(0.62), 'β_c = 0,1 (klejone, LVL)', { fs: 9.5, c: C.d2, a: 'start' }) + T(X(1.25), Y(0.82), '1/λ² (Euler)', { fs: 9, c: C.ink3, a: 'start' });
  [['z', 'y', C.d1], ['y', 'z', C.d2]].forEach(([p, ax]) => { const bk = R.buck[p]; const v = Math.min(xmax, bk.lamRel); s += `<circle cx="${X(v).toFixed(1)}" cy="${Y(bk.kc).toFixed(1)}" r="4.5" style="fill:${C.panel};stroke:${C.ink};stroke-width:1.6"/>` + T(X(v) + 7, Y(bk.kc) - 6, `k_c,${ax} = ${fx(bk.kc, 3)}`, { fs: 10, a: 'start', b: true }); });
  if (R.fire && R.fire.bk) ['z', 'y'].forEach(p => { const bk = R.fire.bk[p], v = Math.min(xmax, bk.lamRel); s += `<rect x="${(X(v) - 3.5).toFixed(1)}" y="${(Y(bk.kc) - 3.5).toFixed(1)}" width="7" height="7" style="fill:${C.fail}"/>`; });
  return s + '</svg>';
}

/* ------------------------------------------------------------ wykres interakcji (6.23 / 6.24) */
function interSVG(R, o) {
  o = o || {};
  const W = o.W || 440, H = o.H || 300, l = 50, r = 16, t = 22, b = 40;
  const pts = [];
  (R.combos.uls || []).forEach(co => {
    if (!co.res) return;
    const r2 = co.res, f = co.fd;
    let best = null;
    for (let i = 0; i < r2.N.length; i++) {
      const N = r2.N[i]; if (N <= 0) continue;
      const g = R.g, sc = N / g.A;
      const smy = g.type === 'round' ? Math.hypot(r2.My[i], r2.Mz[i]) / g.Wy : Math.abs(r2.My[i]) / g.Wy, smz = g.type === 'round' ? 0 : Math.abs(r2.Mz[i]) / g.Wz;
      const a1 = sc / (co.kcy * f.fc0d), m1 = smy / f.fmyd + g.km * smz / f.fmzd;
      const a2 = sc / (co.kcz * f.fc0d), m2 = g.km * smy / f.fmyd + smz / f.fmzd;
      const c1 = a1 + m1 > a2 + m2 ? [m1, a1, 'y'] : [m2, a2, 'z'];
      if (!best || c1[0] + c1[1] > best[0] + best[1]) best = c1;
    }
    if (best) pts.push({ m: best[0], n: best[1], ax: best[2], co });
  });
  const mx = Math.max(1.1, ...pts.map(p => p.m), ...pts.map(p => p.n));
  const X = v => l + v / mx * (W - l - r), Y = v => H - b - v / mx * (H - t - b);
  let s = svgOpen(W, H);
  for (let i = 0; i <= 5; i++) { const v = i * mx / 5; s += Ln(X(v), Y(0), X(v), Y(mx), C.line2, 0.6) + T(X(v), H - b + 14, fx(v, 2), { fs: 9.5, c: C.ink3 }) + Ln(X(0), Y(v), X(mx), Y(v), C.line2, 0.6) + T(l - 5, Y(v) + 3, fx(v, 2), { fs: 9.5, a: 'end', c: C.ink3 }); }
  s += `<path d="M${X(0)} ${Y(1)}L${X(1)} ${Y(0)}L${X(0)} ${Y(0)}Z" style="fill:${C.f3};stroke:none"/>` + Ln(X(0), Y(1), X(1), Y(0), C.ok, 1.6);
  s += Ln(X(0), Y(0), X(mx), Y(0), C.ink, 1) + Ln(X(0), Y(0), X(0), Y(mx), C.ink, 1);
  s += T((W + l) / 2, H - 8, 'udział zginania: σ_m,y,d/f_m,y,d + k_m·σ_m,z,d/f_m,z,d', { fs: 10 }) + T(14, (H - b + t) / 2, 'σ_c,0,d/(k_c·f_c,0,d)', { fs: 10, rot: -90 });
  pts.forEach(p => { const u = p.m + p.n; s += `<circle cx="${X(p.m).toFixed(1)}" cy="${Y(p.n).toFixed(1)}" r="3.2" style="fill:${u > 1 ? C.fail : C.acc};opacity:.75"><title>${p.co.eq}${p.co.lead ? ' – wiodące ' + esc(p.co.lead.name) : ''}: ${fx(u * 100, 0)}% (oś ${p.ax})</title></circle>`; });
  s += T(X(1) + 4, Y(0) - 6, '1,0', { fs: 9.5, a: 'start', c: C.ok });
  return s + '</svg>';
}

/* ------------------------------------------------------------ rysunek słupa (widoki, przekrój, szczegóły) */
function elevSVG(R, S, o) {
  o = o || {};
  const W = o.W || 900, H = o.H || 560, g = R.g, L = R.L;
  uid++;
  const id = 'he' + uid;
  const top = 60, bot = H - 90, sc = (bot - top) / (L + 700);
  const Y = x => bot - 160 * sc / sc - x * sc;
  const yb = bot - 120 * sc - 40;
  const Yc = x => yb - x * sc;
  let s = svgOpen(W, H) + hatch(id, C.ink3);
  const dims = { z: g.type === 'round' ? g.d : g.type === 'spaced' ? g.w : g.h, y: g.type === 'round' ? g.d : g.b };
  const views = [{ p: 'z', x: W * 0.2, t: 'Widok A (płaszczyzna x–z)', w: dims.y }, { p: 'y', x: W * 0.47, t: 'Widok B (płaszczyzna x–y)', w: dims.z }];
  const cn = S.conn;
  const wsc = Math.max(sc, 0.06);
  views.forEach((v, vi) => {
    const cx = v.x, hw = v.w / 2 * wsc;
    s += T(cx, 18, v.t, { fs: 12, b: true });
    // podstawa
    if (cn.base === 'steel') {
      const pa = (vi === 0 ? +cn.plate.a : +cn.plate.b) || 200, B = (vi === 0 ? +cn.plate.B1 : +cn.plate.B2) || 400;
      s += `<rect x="${cx - B / 2 * wsc}" y="${Yc(0) + 10}" width="${B * wsc}" height="46" style="fill:url(#${id});stroke:${C.ink2}"/>` + T(cx, Yc(0) + 72, 'fundament / cokół', { fs: 9.5, c: C.ink3 });
      s += `<rect x="${cx - pa / 2 * wsc}" y="${Yc(0)}" width="${pa * wsc}" height="10" style="fill:${C.steel};stroke:${C.ink}"/>`;
      s += `<rect x="${cx - hw - 4}" y="${Yc(0) - 46}" width="4" height="46" style="fill:${C.steel};stroke:${C.ink}"/><rect x="${cx + hw}" y="${Yc(0) - 46}" width="4" height="46" style="fill:${C.steel};stroke:${C.ink}"/>`;
      for (let k = 0; k < 2; k++) s += `<circle cx="${cx}" cy="${Yc(0) - 14 - k * 18}" r="2.6" style="fill:${C.panel};stroke:${C.ink}"/>`;
    } else if (cn.base === 'sill') {
      const sw = +cn.sill.w || 140;
      const along = (cn.sill.dir === 'y') === (vi === 0);
      s += along ? `<rect x="${cx - 140}" y="${Yc(0)}" width="280" height="${sw * wsc}" style="fill:${C.wood2};stroke:${C.woodln}"/>` : `<rect x="${cx - sw / 2 * wsc}" y="${Yc(0)}" width="${sw * wsc}" height="${sw * wsc}" style="fill:${C.wood2};stroke:${C.woodln}"/>`;
      s += T(cx, Yc(0) + sw * wsc + 14, 'podwalina', { fs: 9.5, c: C.ink3 });
    } else s += Ln(cx - 60, Yc(0), cx + 60, Yc(0), C.ink, 1.5) + `<rect x="${cx - 60}" y="${Yc(0)}" width="120" height="8" style="fill:url(#${id})"/>`;
    // słup
    if (g.type === 'spaced' && vi === 0) {
      g.ys.forEach(yc => { s += `<rect x="${cx + (yc - g.t / 2) * wsc}" y="${Yc(L)}" width="${g.t * wsc}" height="${L * sc}" style="fill:${C.wood};stroke:${C.woodln};stroke-width:1.2"/>`; });
      const nb = R.sp ? R.sp.nb : 3, l2 = R.sp ? R.sp.l2 : 200;
      for (let k = 0; k <= nb; k++) { const xm = Math.min(L - l2 / 2, Math.max(l2 / 2, k * L / nb)); s += `<rect x="${cx - g.b / 2 * wsc}" y="${Yc(xm + l2 / 2)}" width="${g.b * wsc}" height="${l2 * sc}" style="fill:${C.wood2};stroke:${C.woodln};stroke-width:1;opacity:.85"/>`; }
    } else {
      s += `<rect x="${cx - hw}" y="${Yc(L)}" width="${2 * hw}" height="${L * sc}" style="fill:${C.wood};stroke:${C.woodln};stroke-width:1.2"/>`;
      for (let k = 1; k <= 3; k++) s += Ln(cx - hw + 2 * hw * k / 4, Yc(L) + 4, cx - hw + 2 * hw * k / 4 + (k % 2 ? 2 : -2), Yc(0) - 4, C.wood2, 0.8);
    }
    // głowica
    if (cn.top === 'beam') {
      const bwd = +cn.beam.w || 140, along = (cn.beam.dir === 'y') === (vi === 0);
      s += along ? `<rect x="${cx - 150}" y="${Yc(L) - bwd * wsc * 1.4}" width="300" height="${bwd * wsc * 1.4}" style="fill:${C.wood2};stroke:${C.woodln}"/>` : `<rect x="${cx - bwd / 2 * wsc}" y="${Yc(L) - bwd * wsc * 1.4}" width="${bwd * wsc}" height="${bwd * wsc * 1.4}" style="fill:${C.wood2};stroke:${C.woodln}"/>`;
      s += T(cx, Yc(L) - bwd * wsc * 1.4 - 6, 'belka / oczep', { fs: 9.5, c: C.ink3 });
    }
    // stężenia
    R.braces[v.p].forEach(xb => { s += Ln(cx + hw, Yc(xb), cx + hw + 34, Yc(xb), C.acc, 2) + T(cx + hw + 38, Yc(xb) + 4, `stężenie ${fx(xb / 1000, 2)} m`, { fs: 9.5, a: 'start', c: C.acc }); });
    // wymiary
    s += dimV(cx - hw - 34, Yc(L), Yc(0), `${fx(L, 0)}`);
    s += dimH(cx - hw, cx + hw, Yc(L) - (cn.top === 'beam' ? 60 : 16), fx(v.w, 0), { fs: 10 });
    // przekrój A-A
    if (vi === 0) s += Ln(cx - hw - 20, Yc(L * 0.55), cx - hw - 6, Yc(L * 0.55), C.ink, 1.6) + Ln(cx + hw + 6, Yc(L * 0.55), cx + hw + 20, Yc(L * 0.55), C.ink, 1.6) + T(cx - hw - 24, Yc(L * 0.55) + 4, 'A', { fs: 11, b: true, a: 'end' }) + T(cx + hw + 24, Yc(L * 0.55) + 4, 'A', { fs: 11, b: true, a: 'start' });
  });
  // przekrój A–A
  const sx = W * 0.8;
  s += T(sx, 18, 'Przekrój A–A', { fs: 12, b: true });
  s += `<g transform="translate(${sx - 150} 30)">${sectionSVG(R, S, { W: 300, H: 280 }).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</g>`;
  // opis materiału

  if (!list.length) o += `<p class="note">Brak odhaczonych sprawdzeń – zestawienie obejmuje wszystkie sprawdzenia (odhacz je w zakładce Podsumowanie).</p>`;

let calcT = null;
function changed(rerender, after) {
  dirty = true; updateTitle();
  if (rerender) renderInputs();
  clearTimeout(calcT);
  calcT = setTimeout(() => { recalc(); if (typeof after === 'function') after(rerender); }, 40);
  autosave();
}
function recalc() {
  const t0 = performance.now();
  try { R = E.calc(S); } catch (e) { console.error(e); R = { errors: ['Błąd obliczeń: ' + e.message], warnings: [], checks: [] }; }
  U.lastMs = performance.now() - t0;
  U.R = R; U.S = S;
  autoTicks();
  rendered = {};
  renderStatus(); renderDsum(); refreshHints(); renderDataSide(); renderActive();
}
// sprawdzenia, które przestały być spełnione, są odznaczane; spełnione ponownie – zaznaczane, jeśli wcześniej odznaczono automatycznie
let prevStat = null;
function autoTicks() {
  if (!R || !R.checks) return;
  const t = S.meta.ticks = S.meta.ticks || {}, auto = S.meta.autoUn = S.meta.autoUn || {};
  const cur = {}; R.checks.forEach(c => { cur[c.key] = c.status; });
  if (prevStat) R.checks.forEach(c => {
    const was = prevStat[c.key];
    if (c.status === 'fail' && t[c.key]) { delete t[c.key]; auto[c.key] = true; }
    else if (c.status !== 'fail' && was === 'fail' && auto[c.key]) { t[c.key] = true; delete auto[c.key]; }
  });
  prevStat = cur;
}

function renderStatus() {
  const el = $('#status');
  const set = (cls, txt) => { el.className = cls; el.textContent = txt; };
  if (!R || (R.errors && R.errors.length)) { set('fail', '✖ Błąd danych'); return; }
  const fails = R.checks.filter(c => c.status === 'fail').length, warns = R.checks.filter(c => c.status === 'warn').length;
  if (fails) set('fail', `✖ Niespełnione warunki: ${fails}`);
  else if (warns) set('warn', `✔ Nośność OK · uwagi: ${warns} · η = ${fmt(R.maxUtil * 100, 0)}%`);
  else set('ok', `✔ Wszystkie warunki spełnione · η = ${fmt(R.maxUtil * 100, 0)}%`);
}
const CHIP_GRPS = [['SGN – nośność przekroju', 'Przekrój'], ['SGN – stateczność', 'Stateczność'], ['Oparcie i docisk', 'Oparcie'], ['SGU – przemieszczenia', 'SGU'], ['Odporność ogniowa', 'Pożar'], ['Warunki konstrukcyjne', 'Konstrukcja']];

    const list = R.checks.filter(c => c.grp === g && c.status !== 'info'); if (!list.length) return '';

  }).join('') + (R.warnings || []).map(w => `<span class="chip warn" title="${esc(w)}"><b>⚠</b> ${esc(w.slice(0, 60))}${w.length > 60 ? '…' : ''}</span>`).join('');

    const ne = R.xs.length - 1, xs = []; for (let e = 0; e < ne; e++) xs.push(R.xs[e], R.xs[e + 1]);
    const ch = (key, title, unit, k, div, c, fill) => G.vChart({ key, W: 140, H: 260, title, unit, xs, L: R.L, series: [{ v: R.env[k].max.map(v => v / div), c, fill }, { v: R.env[k].min.map(v => v / div), c, fill, dash: '' }], dp: 1 });
    o += `<div class="box"><h4>Obwiednie SGN <small>wartości obliczeniowe</small></h4><div class="flex" style="gap:6px">${ch('N', 'N [kN]', '+ ściskanie', 'N', 1e3, G.C.d1, G.C.f1)}${ch('My', 'M_y [kNm]', 'płaszcz. x–z', 'My', 1e6, G.C.d2, G.C.f2)}${ch('Mz', 'M_z [kNm]', 'płaszcz. x–y', 'Mz', 1e6, G.C.d3, G.C.f3)}${ch('Vz', 'V_z [kN]', '', 'Vz', 1e3, G.C.d2, '')}</div></div>`;
    const gov = R.checks.filter(c => c.status !== 'info' && isFinite(c.ratio) && c.fmt !== 'text' && !c.warnOnly).sort((a, b) => b.ratio - a.ratio)[0];
    if (gov) o += `<p class="hint">Decyduje: <b>${sym(gov.name)}</b> – η = ${fmt(gov.ratio * 100, 0)}%${gov.combo ? ` (${esc(gov.combo)})` : ''}. Obliczenia: ${fmt(U.lastMs || 0, 0)} ms.</p>`;
  }
  el.innerHTML = o;
  el.onclick = e => {
    const h = e.target.closest('[data-act]'); if (h) { act(h.dataset.act, h); return; }
  };
}

/* ------------------------------------------------------------ zakładki */
function renderActive() {
  const t = ($('.tabs button.on') || {}).dataset;
  const tab = t ? t.tab : 'data';
  if (tab === 'data' || rendered[tab]) return;
  rendered[tab] = true;
  const el = $('#p-' + tab);
  if (!R || (R.errors && R.errors.length)) { el.innerHTML = errBox(); return; }
  try {
    ({ sec: renderSection, chart: renderCharts, stab: renderStab, draw: renderDraw, sum: renderSummary, report: renderReport })[tab](el);
  } catch (e) { console.error(e); el.innerHTML = `<div class="msg err">Błąd wyświetlania: ${esc(e.message)}</div>`; }
}
function errBox() { return `<div class="msgs">${((R && R.errors) || ['Brak wyników']).map(e => `<div class="msg err">${esc(e)}</div>`).join('')}</div><p class="hint">Popraw dane w zakładce Dane.</p>`; }

/* ---- przekrój i materiał */
function renderSection(el) {
  const g = R.g, m = R.m;

  const props = [['Pole przekroju A', fmt(g.A / 100, 2), 'cm²'], ['I_{y}', fmt(g.Iy / 1e4, 1), 'cm⁴'], ['I_{z}', fmt(g.Iz / 1e4, 1), 'cm⁴'], ['W_{y}', fmt(g.Wy / 1e3, 1), 'cm³'], ['W_{z}', fmt(g.Wz / 1e3, 1), 'cm³' + (g.type === 'spaced' ? ' (pełna współpraca – do obliczeń I_{ef})' : '')], ['i_{y}', fmt(g.iy, 1), 'mm'], ['i_{z}', fmt(g.iz, 1), 'mm'], ['I_{tor}', fmt(g.It / 1e4, 1), 'cm⁴'], ['k_{m}', fmt(g.km, 1), g.type === 'round' ? 'przekrój okrągły – moment wypadkowy' : ''], ['k_{h,y} / k_{h,z}', `${fmt(R.kh.y.k, 3)} / ${fmt(R.kh.z.k, 3)}`, ''], ['Ciężar własny g', fmt(m.gamma * g.A * 1e-6, 3), 'kN/m']];
  if (S.geom.hole > 0) props.push(['Osłabienie ΔA', fmt(S.geom.hole, 0), '%']);
  // wartości obliczeniowe dla kolejnych klas trwania

  o += `<div class="box"><h4>Charakterystyki geometryczne</h4>${kv(props)}</div>`;
  o += `<div class="box"><h4>${esc(m.name)} <small>${esc(m.std)}, ${esc(m.kindName)}</small></h4>${kv([['f_{m,k}', fmt(m.fmk, 1), 'MPa'], ['f_{t,0,k}', fmt(m.ft0k, 1), 'MPa'], ['f_{c,0,k}', fmt(m.fc0k, 1), 'MPa'], ['f_{c,90,k}', fmt(m.fc90k, 2), 'MPa'], ['f_{v,k}', fmt(m.fvk, 1), 'MPa'], ['E_{0,mean}', fmt(m.E0mean, 0), 'MPa'], ['E_{0,05}', fmt(m.E005, 0), 'MPa'], ['G_{mean} / G_{0,05}', `${fmt(m.Gmean, 0)} / ${fmt(m.G005, 0)}`, 'MPa'], ['ρ_{k} / ρ_{mean}', `${fmt(m.rhok, 0)} / ${fmt(m.rhomean, 0)}`, 'kg/m³'], ['γ_{M}', fmt(m.gM, 2), ''], ['k_{def} (klasa ' + m.sc + ')', fmt(m.kdef, 2), ''], ['β_{c}', fmt(m.betaC, 1), ''], ['k_{cr}', fmt(m.kcr, 2), ''], ['k_{sys}', fmt(m.ksys, 2), '']])}</div>`;
  o += `</div><div class="box" style="margin-top:14px"><h4>Wytrzymałości obliczeniowe f<sub>d</sub> = k<sub>mod</sub>·k<sub>sys</sub>·(k<sub>h</sub>)·f<sub>k</sub>/γ<sub>M</sub> [MPa] <small>klasa użytkowania ${m.sc}</small></h4><div class="tscroll"><table class="sched"><thead><tr><th>Klasa trwania</th><th>k<sub>mod</sub></th><th>f<sub>c,0,d</sub></th><th>f<sub>m,y,d</sub></th><th>f<sub>m,z,d</sub></th><th>f<sub>t,0,d</sub></th><th>f<sub>v,d</sub></th><th>f<sub>c,90,d</sub></th></tr></thead><tbody>${vals}</tbody></table></div></div>`;

    o += `<div class="flex" style="margin-top:14px"><div class="box"><h4>Odporność ogniowa R${F.t} – metoda zredukowanego przekroju</h4>${kv([['β_{0} / β_{n}', `${fmt(m.beta0, 2)} / ${fmt(m.betan, 2)}`, 'mm/min'], ['Zwęglenie', sym(F.ch.txt), ''], ['d_{ef} = d_{char,n} + k_{0}·d_{0}', fmt(F.def, 1), 'mm'], ['Przekrój resztkowy', F.ok ? sym(F.desc) : '<span style="color:var(--fail)">brak</span>', ''], ['k_{fi}', fmt(m.kfi, 2), ''], ...(F.ok ? [['f_{c,0,d,fi}', fmt(F.f.fc0d, 2), 'MPa'], ['f_{m,d,fi}', fmt(F.f.fmyd, 2), 'MPa'], ['λ_{rel,y,fi} / k_{c,y,fi}', `${fmt(F.bk.z.lamRel, 3)} / ${fmt(F.bk.z.kc, 3)}`, ''], ['λ_{rel,z,fi} / k_{c,z,fi}', `${fmt(F.bk.y.lamRel, 3)} / ${fmt(F.bk.y.kc, 3)}`, '']] : [])])}</div>`;
    o += `<div class="box"><h4>Efektywna głębokość zwęglenia d<sub>ef</sub>(t)</h4>${G.lineChart({ W: 420, H: 220, series: [{ x: ts, y: dd, c: G.C.fail }], xl: 't [min]', yl: 'd_ef [mm]', marks: [{ x: F.t, l: `R${F.t}` }] })}</div></div>`;

/* ---- wykresy */
let chartSel = 'env';
function chartSeries() {
  const ne = R.xs.length - 1, xs = []; for (let e = 0; e < ne; e++) xs.push(R.xs[e], R.xs[e + 1]);
  const nodes = R.xs;
  const out = { xs, nodes, s: {} };
  if (chartSel === 'env') {
    const pick = (k, d) => [R.env[k].max.map(v => v / d), R.env[k].min.map(v => v / d)];
    out.s = { N: pick('N', 1e3), My: pick('My', 1e6), Mz: pick('Mz', 1e6), Vz: pick('Vz', 1e3), Vy: pick('Vy', 1e3) };
    // przemieszczenia – kombinacja charakterystyczna o największym u
    const co = R.sls && R.sls.inst && R.sls.inst.co ? R.sls.inst.co : R.combos.chr[0];
    const r = co ? E.combine(R, co) : null;
    out.u = r ? { uz: r.uz, uy: r.uy, name: co.eq + ': ' + co.desc } : null;
    out.name = 'Obwiednia kombinacji SGN (max / min)';
  } else {
    const [t, n] = chartSel.split(':'), list = t === 'chr' ? R.combos.chr : t === 'acc' ? R.combos.acc : R.combos.uls, co = list[+n];
    const r = co ? (co.res || E.combine(R, co)) : null;
    if (!r) { chartSel = 'env'; return chartSeries(); }
    out.s = { N: [r.N.map(v => v / 1e3)], My: [r.My.map(v => v / 1e6)], Mz: [r.Mz.map(v => v / 1e6)], Vz: [r.Vz.map(v => v / 1e3)], Vy: [r.Vy.map(v => v / 1e3)] };
    out.u = { uz: r.uz, uy: r.uy, name: co.desc };
    out.name = `${co.eq}: ${co.desc}${co.kmod ? ` (k_mod = ${fmt(co.kmod, 2)})` : ''}`;
  }
  return out;
}
function renderCharts(el) {
  const cs = chartSeries();
  const opt = [['env', 'Obwiednia SGN (max / min)'], ...R.combos.uls.map((c, i) => [`uls:${i}`, `K${c.no}: ${c.eq} – ${c.desc}${c.lead ? ' (wiodące ' + c.lead.name + ')' : ''} · k_mod ${fmt(c.kmod, 2)} · η ${fmt((c.util || 0) * 100, 0)}%`]), ...R.combos.acc.map((c, i) => [`acc:${i}`, `KW${c.no}: ${c.eq} – ${c.desc}`]), ...R.combos.chr.map((c, i) => [`chr:${i}`, `SGU ${c.eq}: ${c.desc}`])];
  const H = 400;
  const mk = (key, title, unit, arr, c, f, dp) => G.vChart({ key, W: 150, H, title, unit, xs: cs.xs, L: R.L, series: arr.map((v, j) => ({ v, c, fill: f, dash: j ? '' : '' })), dp });
  let o = `<div class="toolrow"><label>Wykresy dla: <select id="chSel">${opt.map(([v, t]) => `<option value="${v}"${v === chartSel ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label><span class="sp"></span><span class="hint">Najedź kursorem na wykres – wartości na tej samej wysokości we wszystkich wykresach.</span></div>`;
  o += `<div class="box"><h4>${sym(cs.name)}</h4><div class="flex" style="gap:4px" id="vcharts">`;
  o += mk('N', 'N [kN]', '+ ściskanie', cs.s.N, G.C.d1, G.C.f1, 1) + mk('My', 'M_y [kNm]', 'płaszczyzna x–z', cs.s.My, G.C.d2, G.C.f2, 2) + mk('Mz', 'M_z [kNm]', 'płaszczyzna x–y', cs.s.Mz, G.C.d3, G.C.f3, 2) + mk('Vz', 'V_z [kN]', 'płaszczyzna x–z', cs.s.Vz, G.C.d2, '', 2) + mk('Vy', 'V_y [kN]', 'płaszczyzna x–y', cs.s.Vy, G.C.d3, '', 2);
  if (cs.u) o += G.vChart({ key: 'uz', W: 130, H, title: 'u_z [mm]', unit: 'SGU char.', xs: cs.nodes, L: R.L, series: [{ v: cs.u.uz, c: G.C.d2, fill: G.C.f2 }], dp: 2 }) + G.vChart({ key: 'uy', W: 130, H, title: 'u_y [mm]', unit: 'SGU char.', xs: cs.nodes, L: R.L, series: [{ v: cs.u.uy, c: G.C.d3, fill: G.C.f3 }], dp: 2 });
  o += `</div>${cs.u ? `<p class="hint">Przemieszczenia: ${sym(cs.u.name)} (E<sub>0,mean</sub>, bez pełzania).</p>` : ''}</div>`;
  // reakcje
  const rea = R.combos.uls.map(c => ({ c, r: c.res })).filter(q => q.r);
  const top = R.xs.length * 2 - 3;
  const ext = (f) => rea.reduce((a, q) => { const v = f(q.r); return !a || v > a.v ? { v, c: q.c } : a; }, null);
  const rows = [
    ['N<sub>Ed,max</sub> w podstawie (ściskanie)', ext(r => r.N[0]), 1e3, 'kN'], ['N<sub>Ed,min</sub> w podstawie', ext(r => -r.N[0]), -1e3, 'kN'],
    ['|V<sub>z,Ed</sub>| w podstawie', ext(r => Math.abs(r.Vz[0])), 1e3, 'kN'], ['|V<sub>y,Ed</sub>| w podstawie', ext(r => Math.abs(r.Vy[0])), 1e3, 'kN'],
    ['|M<sub>y,Ed</sub>| w podstawie', ext(r => Math.abs(r.My[0])), 1e6, 'kNm'], ['|M<sub>z,Ed</sub>| w podstawie', ext(r => Math.abs(r.Mz[0])), 1e6, 'kNm'],
    ['|V<sub>z,Ed</sub>| w głowicy (reakcja stężenia)', ext(r => Math.abs(r.Vz[top])), 1e3, 'kN'], ['|V<sub>y,Ed</sub>| w głowicy (reakcja stężenia)', ext(r => Math.abs(r.Vy[top])), 1e3, 'kN'],
  ].filter(q => q[1] && Math.abs(q[1].v) > 1e-6);
  o += `<div class="flex" style="margin-top:14px"><div class="box"><h4>Siły w podporach – wartości ekstremalne SGN</h4><table class="sched"><thead><tr><th>Wielkość</th><th>Wartość</th><th>Kombinacja</th></tr></thead><tbody>${rows.map(q => `<tr><td>${q[0]}</td><td class="n">${fmt(q[1].v / Math.abs(q[2]) * Math.sign(q[2]), 2)} ${q[3]}</td><td>K${q[1].c.no}: ${esc(q[1].c.eq)} – ${esc(q[1].c.desc)}</td></tr>`).join('')}</tbody></table></div>`;
  // przypadki obciążeń
  o += `<div class="box"><h4>Przypadki obciążeń (wartości charakterystyczne)</h4><table class="sched"><thead><tr><th>Id</th><th>Nazwa</th><th>Trwanie</th><th>ψ₀ / ψ₁ / ψ₂</th><th>N<sub>k</sub> podst. [kN]</th><th>max|M<sub>y,k</sub>|</th><th>max|M<sub>z,k</sub>|</th></tr></thead><tbody>${R.cases.map(c => { const r = R.resp[c.id]; const mx = a => Math.max(...a.map(Math.abs)); return `<tr><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(E.DUR[c.dur].n)}</td><td class="n">${c.kind === 'perm' || c.kind === 'acc' ? '—' : `${fmt(c.psi.p0, 1)} / ${fmt(c.psi.p1, 1)} / ${fmt(c.psi.p2, 1)}`}</td><td class="n">${fmt(r.N[0] / 1e3, 2)}</td><td class="n">${fmt(mx(r.My) / 1e6, 2)}</td><td class="n">${fmt(mx(r.Mz) / 1e6, 2)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  // kombinacje
  const top10 = R.combos.uls.slice().sort((a, b) => (b.util || 0) - (a.util || 0)).slice(0, 12);
  o += `<div class="box" style="margin-top:14px"><h4>Kombinacje SGN – najbardziej wytężone <small>łącznie ${R.combos.uls.length}; kliknij wiersz, aby pokazać wykresy</small></h4><div class="tscroll"><table class="sched click"><thead><tr><th>Nr</th><th>Wzór</th><th>Kombinacja</th><th>Wiodące</th><th>Klasa trwania</th><th>k<sub>mod</sub></th><th>η<sub>max</sub></th></tr></thead><tbody>${top10.map(c => `<tr data-cs="uls:${R.combos.uls.indexOf(c)}" class="${chartSel === 'uls:' + R.combos.uls.indexOf(c) ? 'cur' : ''}"><td>K${c.no}</td><td>${esc(c.eq)}</td><td>${esc(c.desc)}</td><td>${esc(c.lead ? c.lead.name : '—')}</td><td>${esc(E.DUR[c.dur].n)}</td><td class="n">${fmt(c.kmod, 2)}</td><td class="n">${fmt((c.util || 0) * 100, 1)}%</td></tr>`).join('')}</tbody></table></div></div>`;
  el.innerHTML = o;
  $('#chSel', el).onchange = e => { chartSel = e.target.value; renderCharts(el); };
  $$('[data-cs]', el).forEach(tr => tr.onclick = () => { chartSel = tr.dataset.cs; renderCharts(el); el.scrollTop = 0; });
  bindChartCursor($('#vcharts', el), cs);
}
function bindChartCursor(root, cs) {
  if (!root) return;
  const charts = $$('svg.vchart', root);
  const valAt = (key, x) => {
    const arr = key === 'uz' || key === 'uy' ? [cs.u[key]] : cs.s[key]; const xs = key === 'uz' || key === 'uy' ? cs.nodes : cs.xs;
    if (!arr) return '';
    return arr.map(a => { let best = 0, bd = Infinity; xs.forEach((v, i) => { const d = Math.abs(v - x); if (d < bd) { bd = d; best = i; } }); return fmt(a[best], 2); }).join(' / ');
  };
  const move = e => {
    const svg = e.target.closest('svg.vchart'); if (!svg) return;
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, y = (e.clientY - r.top) / r.height * vb.height;
    const top = +svg.dataset.top, bot = +svg.dataset.bot, L = +svg.dataset.l;
    const x = Math.max(0, Math.min(L, (bot - y) / (bot - top) * L));
    charts.forEach(c => { const yy = bot - x / L * (bot - top); const ln = $('.curline', c), tx = $('.curtxt', c); ln.setAttribute('y1', yy); ln.setAttribute('y2', yy); tx.setAttribute('y', yy - 3); tx.textContent = valAt(c.dataset.chart, x); });
    const t = $('.curtxt', charts[0]); if (t) t.textContent = `x = ${fmt(x / 1000, 2)} m: ` + valAt(charts[0].dataset.chart, x);
  };
  root.addEventListener('mousemove', move);
  root.addEventListener('mouseleave', () => charts.forEach(c => { $('.curline', c).setAttribute('y1', -10); $('.curline', c).setAttribute('y2', -10); $('.curtxt', c).textContent = ''; }));
}

/* ---- stateczność */
function renderStab(el) {
  const b = R.buck, m = R.m;
  const row = (p, ax) => { const q = b[p]; return `<tr><td>${ax}</td><td class="n">${fmt(q.lef / 1000, 3)}${q.manual ? ' (ręcznie)' : ''}</td><td class="n">${fmt(q.beta, 3)}</td><td class="n">${fmt(q.i, 1)}</td><td class="n">${fmt(q.lam, 1)}${q.spaced ? ' (λ<sub>ef</sub>)' : ''}</td><td class="n">${fmt(q.lamRel, 3)}</td><td class="n">${fmt(q.k, 3)}</td><td class="n"><b>${fmt(q.kc, 3)}</b></td></tr>`; };
  let o = `<div class="h2">Stateczność <small>metoda: ${S.buck.method === 'kc' ? 'współczynnik wyboczeniowy k<sub>c</sub> (6.3.2)' : 'analiza II rzędu z imperfekcjami (5.4.4)'}</small></div>`;
  o += `<div class="flex"><div class="box"><h4>Postacie wyboczenia (MES) i długości wyboczeniowe</h4>${G.modeSVG(R, S, { W: 440, H: 380 })}</div>`;
  o += `<div class="box"><h4>Współczynniki wyboczeniowe <small>β<sub>c</sub> = ${fmt(m.betaC, 1)}, √(f<sub>c,0,k</sub>/E<sub>0,05</sub>) = ${fmt(Math.sqrt(m.fc0k / m.E005), 4)}</small></h4><table class="sched"><thead><tr><th>Oś</th><th>l<sub>ef</sub> [m]</th><th>β</th><th>i [mm]</th><th>λ</th><th>λ<sub>rel</sub></th><th>k</th><th>k<sub>c</sub></th></tr></thead><tbody>${row('z', 'y (płaszczyzna x–z)')}${row('y', 'z (płaszczyzna x–y)')}</tbody></table>${G.kcSVG(R, { W: 440, H: 250 })}<p class="hint">Kółka – słup; kwadraty – przekrój resztkowy w pożarze.</p></div></div>`;

  try {
